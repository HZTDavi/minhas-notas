<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas Notas</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icones/icone-pequeno.svg" type="image/svg+xml">
  <link rel="icon" href="icones/icone-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icones/icone-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#202124">
  <link rel="stylesheet" href="estilo.css">
  <script>
    let t = 'dark'; try { t = localStorage.getItem('tema') || 'dark'; } catch (e) {} document.documentElement.dataset.theme = t;
  </script>
</head>
<body>
  <header class="topo">
    <button class="icone-btn" id="btn-menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
    <div class="marca"><img src="icones/icone-pequeno.svg" alt=""><span>Minhas Notas</span></div>
    <label class="busca">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="busca" type="search" placeholder="Pesquisar" autocomplete="off">
    </label>
    <button class="aparelho-btn" id="btn-aparelho" title="Trocar de aparelho" hidden></button>
    <button class="icone-btn" id="btn-tema" title="Alternar tema claro/escuro"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg></button>
    <button class="icone-btn" id="btn-mais" title="Mais opções"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
  </header>

  <div class="corpo">
    <nav class="lateral" id="lateral"></nav>
    <main class="principal">
      <div class="criar" id="criar">
        <button class="criar-texto" id="criar-nota">Criar uma nota…</button>
        <button class="icone-btn" id="criar-lista" title="Nova lista"><svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-9 14-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></button>
        <button class="icone-btn" id="criar-lembrete" title="Nova nota com lembrete"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></button>
      </div>
      <div class="faixa-remoto" id="faixa-remoto" hidden></div>
      <div id="conteudo"></div>
    </main>
  </div>

  <div class="fundo-modal" id="modal" hidden>
    <div class="editor" id="editor"></div>
  </div>
  <div class="aviso" id="aviso" hidden></div>
  <input type="file" id="arquivo-importar" accept=".json,application/json,application/octet-stream,text/plain" hidden>

  <script src="app.js"></script>
  <script src="nuvem-config.js"></script>
  <script src="nuvem.js"></script>
  <script src="atualizar.js"></script>
  <script>document.getElementById('btn-aparelho').onclick = e => window.Nuvem?.menuAparelhos(e.currentTarget);</script>
</body>
</html>
